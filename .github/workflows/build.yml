name: Build Windows Installer

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build EXE with PyInstaller
        run: pyinstaller --noconfirm --onefile --windowed --add-data "ui.html;." --collect-all webview --name SecureBatchPrinter app.py

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Compile installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss'

      - name: Upload installer (Setup.exe)
        uses: actions/upload-artifact@v4
        with:
          name: SecureBatchPrinter-Setup
          path: Output/SecureBatchPrinter-Setup.exe

      - name: Upload portable EXE
        uses: actions/upload-artifact@v4
        with:
          name: SecureBatchPrinter-portable-exe
          path: dist/SecureBatchPrinter.exe
